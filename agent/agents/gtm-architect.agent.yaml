apiVersion: rostr.ai/v2
kind: Agent
metadata:
  id: loadsmart-pod-copilot
  name: Loadsmart GTM Pod Copilot
  version: 1.0.0
spec:
  role: Orchestrator. Compiles Loadsmart ABM pod requests into verified, complete asset packages across Opendock, ShipperGuide, Loadsmart AI, and Freight Services.
  instructions: ../instructions/system.md
  runtime:
    sdk: vercel-ai-sdk@7
    entrypoint: lib/agent/pipeline.ts
    chat: app/api/chat/route.ts
    durable: workers/gtm-durable (Cloudflare Agents / Durable Objects)
    manifest_check: lib/agent/manifest.ts (GET /api/health reports agent wiring problems)
    observability: langsmith (traceable spans per stage)
  pipeline: [intake, intent, foundation, instruct, plan, build, test, present]
  inputs: [chat_messages, questionnaire, files, links, webhook_payload]
  outputs: [run_manifest, gtm_assets, pop_11_documents, quality_report, next_action]
  subagents:
    - icp-architect
    - persona-architect
    - messaging-architect
    - outbound-architect
    - competitive-architect
    - kpi-architect
    - playbook-architect
    - prospector
    - automation-engineer
    - execution-analyst
    - sdr-assistant
    - clay-architect
    - gtm-wizard
    - tech-stack-advisor
    - sop-builder
    - pal-reasoner
  tools:
    - search_knowledge      # RAG-DAL over the workspace knowledge base
    - read_document         # any public URL: web, PDF, Office, image (OCR/vision), audio/video
    - list_artifacts        # read the GTM Library
    - get_artifact
    - revise_artifact       # writes a new version (human can roll back)
    - truth_check
    - analyze_n8n_execution # diagnose n8n workflow execution failures and RCA
    - generate_elt_pipeline_report # aggregate pipeline metrics and export ELT tables
    - send_to_workflow      # n8n / Make / Zapier webhook — needsApproval
  guardrails:
    - Do not build below W = 1.00.
    - Label assumptions; never invent operational data.
    - Never bypass approval gates.
